<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ariel Rizki Pratama | Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
        }

        .site-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        /* Hero Section */
        .hero-section {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 3rem;
            padding: 2rem 0 4rem 0;
            min-height: 75vh;
        }

        .hero-content {
            flex: 1;
        }

        .badge {
            display: inline-block;
            padding: 0.4rem 1rem;
            background-color: rgba(249, 115, 22, 0.15);
            color: #f97316;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
        }

        .hero-content h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: #ffffff;
            letter-spacing: -0.025em;
            line-height: 1.2;
        }

        .hero-content p {
            font-size: 1.125rem;
            color: #94a3b8;
            margin-bottom: 1.5rem;
        }

        .hero-meta {
            font-size: 1rem;
            color: #cbd5e1;
            border-top: 1px solid #334155;
            padding-top: 1.25rem;
        }

        /* Kotak Foto Profil */
        .hero-image-wrapper {
            width: 320px;
            height: 320px;
            border-radius: 1.5rem;
            overflow: hidden;
            background-color: #1e293b;
            border: 1px solid #334155;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            position: relative;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .fallback-initials {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            color: #f97316;
        }

        /* Bagian Proyek */
        .projects-section {
            margin-top: 2rem;
            border-top: 1px solid #334155;
            padding-top: 3rem;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .project-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 1rem;
            padding: 1.75rem;
            transition: transform 0.2s, border-color 0.2s;
        }

        .project-card:hover {
            transform: translateY(-4px);
            border-color: #f97316;
        }

        .project-card h3 {
            color: #ffffff;
            margin-bottom: 0.5rem;
            font-size: 1.25rem;
        }

        .project-card p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 0;
        }

        /* Responsif HP */
        @media (max-width: 768px) {
            .site-container {
                padding: 1.5rem 1rem;
            }
            .hero-section {
                flex-direction: column-reverse;
                text-align: center;
                gap: 2rem;
                padding: 1rem 0 2rem 0;
            }
            .hero-content h1 {
                font-size: 2.25rem;
            }
            .hero-image-wrapper {
                width: 240px;
                height: 240px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

    <div class="site-container">
        
        <!-- HERO SECTION -->
        <header class="hero-section">
            <div class="hero-content">
                <span id="statusBadge" class="badge">Student</span>
                <h1 id="mainTitle">Programmer And Software Engineer</h1>
                <p id="mainIntro">Hello everyone, let me introduce myself. I am Ariel Rizki Pratama, a senior high school student with a talent in coding.</p>
                <div class="hero-meta">
                    <span>Based in: <strong id="locationText">Makassar, Indonesia</strong></span>
                </div>
            </div>
            
            <!-- FOTO PROFIL -->
            <div class="hero-image-wrapper">
                <img id="profilePhoto" src="avatar.jpeg" alt="Ariel Rizki Pratama" onerror="this.style.display='none'; document.getElementById('fallbackInitials').style.display='flex';">
                <div id="fallbackInitials" class="fallback-initials" style="display:none;">Arl</div>
            </div>
        </header>

        <!-- SEKSI PROJECT -->
        <section class="projects-section">
            <h2 style="color: #fff; font-size: 1.8rem; margin-bottom: 0.5rem;">My Projects</h2>
            <div id="projectsContainer" class="projects-grid"></div>
        </section>

    </div>

    <script>
        const PROJECTS = [
            { 
                title: "Web Class 10 Modesty", kind: "Website",
                desc: "Website kelas 10 Modesty yang saya buat, terdiri dari lobby, informasi kelas, data siswa, dan galeri."
            },
            { 
                title: "Web Class 10 Honesty", kind: "Website",
                desc: "Website kelas 10 Honesty, mirip dengan web kelas 10 Modesty: informasi kelas dan data siswa."
            },
            { 
                title: "Timer Control", kind: "Web app",
                desc: "Project bertema waktu yang berisi alarm, timer, stopwatch, dan kompas."
            },
            { 
                title: "To Do List Homework", kind: "Web app",
                desc: "Project untuk mencatat semua tugas atau kegiatan yang akan datang."
            }
        ];

        window.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("projectsContainer");
            container.innerHTML = PROJECTS.map(p => `
                <div class="project-card">
                    <span style="color: #f97316; font-size: 0.8rem; font-weight: bold; text-transform: uppercase;">${p.kind}</span>
                    <h3 style="margin-top: 0.25rem;">${p.title}</h3>
                    <p>${p.desc}</p>
                </div>
            `).join("");
        });
    </script>
</body>
</html>
