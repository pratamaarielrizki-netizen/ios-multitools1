<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ariel Rizki Pratama | Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #0f172a;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        /* Background Dot Matrix Pattern */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 32px 32px;
            opacity: 0.4;
            z-index: -1;
        }

        .site-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
        }

        /* Navbar */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 0;
            margin-bottom: 3rem;
        }

        .nav-logo {
            font-weight: 800;
            font-size: 1.25rem;
            color: #0f172a;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #475569;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #0f172a;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .ctrl-k {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .theme-toggle {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #475569;
            font-size: 1rem;
        }

        .btn-lets-talk {
            background-color: #0f172a;
            color: #ffffff;
            border: none;
            padding: 0.6rem 1.25rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
        }

        .btn-lets-talk:hover {
            background-color: #1e293b;
        }

        /* Hero Section */
        .hero-section {
            padding: 4rem 0 6rem 0;
            max-width: 850px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.85rem;
            background-color: rgba(245, 158, 11, 0.1);
            color: #d97706;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background-color: #f59e0b;
            border-radius: 50%;
        }

        .hero-section h1 {
            font-size: 4.5rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 1.5rem;
        }

        .hero-section p {
            font-size: 1.25rem;
            color: #475569;
            margin-bottom: 2.5rem;
        }

        .hero-buttons {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-primary {
            background-color: #0f172a;
            color: #ffffff;
            padding: 0.8rem 1.75rem;
            border-radius: 9999px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background-color: #1e293b;
        }

        .btn-secondary {
            background-color: transparent;
            color: #0f172a;
            border: 1px solid #cbd5e1;
            padding: 0.8rem 1.75rem;
            border-radius: 9999px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn-secondary:hover {
            background-color: #f8fafc;
            border-color: #94a3b8;
        }

        /* Responsif HP */
        @media (max-width: 768px) {
            .nav-links, .ctrl-k {
                display: none;
            }
            .hero-section h1 {
                font-size: 3rem;
            }
            .hero-buttons {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <div class="site-container">
        
        <!-- NAVBAR -->
        <nav>
            <a href="#" class="nav-logo" id="logoText">Arl</a>
            <ul class="nav-links">
                <li><a href="#projects">Projects</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#journey">Journey</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
            <div class="nav-actions">
                <div class="ctrl-k">Ctrl K</div>
                <div class="theme-toggle">🌙</div>
                <a href="#contact" class="btn-lets-talk">Let's talk</a>
            </div>
        </nav>

        <!-- HERO SECTION -->
        <header class="hero-section">
            <div class="badge">
                <div class="badge-dot"></div>
                <span id="statusText">Student</span>
            </div>
            <h1 id="mainTitle">Welcome to My Portfolio.</h1>
            <p id="mainIntro">Hello, I am a student who became a programmer.</p>
            <div class="hero-buttons">
                <a href="#projects" class="btn-primary">See my projects</a>
                <a href="#contact" class="btn-secondary">Send an email</a>
            </div>
        </header>

    </div>

</body>
</html>
