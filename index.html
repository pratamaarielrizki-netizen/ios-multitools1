<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nama Kamu | Data & AI Engineer</title>
<meta name="description" content="Portfolio of Nama Kamu, data and AI engineer based in Makassar.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bar"></div>
 
<header>
  <div class="wrap">
    <a class="logo" href="#top" id="logo"></a>
    <nav>
      <a href="#projects">Projects</a><a href="#about">About</a><a href="#journey">Journey</a><a href="#contact">Contact</a>
      <button class="kbd" id="palBtn" aria-label="Open command menu"></button>
      <button class="theme" id="theme" aria-label="Toggle dark mode"></button>
      <a class="btn" href="#contact">Let's talk</a>
    </nav>
  </div>
</header>
 
<main id="top">
  <div class="hero">
    <canvas id="field" aria-hidden="true"></canvas>
    <div class="wrap">
      <span class="tag"><i></i><span id="status"></span></span>
      <h1 id="headline"></h1>
      <p id="intro"></p>
      <div class="cta">
        <a class="btn" href="#projects">See my projects</a>
        <a class="btn ghost" id="mailBtn" href="#">Send an email</a>
      </div>
    </div>
  </div>
 
  <section id="projects">
    <div class="wrap">
      <div class="head">
        <h2>My Projects</h2>
        <p>These are some of my projects.</p>
      </div>
      <ul class="projects" id="projectList"></ul>
    </div>
  </section>
 
  <section class="stack" id="stack">
    <div class="wrap"><div class="head" style="margin-bottom:10px"><h2>Tools I work with</h2></div></div>
    <div id="lanes" style="padding-bottom:10px"></div>
  </section>
 
  <section id="about">
    <div class="wrap about">
      <div>
        <h2 id="aboutTitle"></h2>
        <p id="aboutText"></p>
        <dl class="facts" id="facts"></dl>
      </div>
      <div class="photo" id="photo"></div>
    </div>
  </section>
 
  <section id="journey">
    <div class="wrap">
      <div class="head"><h2>Journey</h2><p>Pendidikan</p></div>
      <ol class="tl" id="timeline"></ol>
    </div>
  </section>
 
  <section class="contact" id="contact">
    <div class="wrap">
      <h2>Have data that needs a plan?</h2>
      <a class="mail" id="mail" href="#"></a>
      <div class="socials" id="socials"></div>
      <form class="form" id="form">
        <input name="n" placeholder="Your name" aria-label="Your name" required>
        <input name="m" type="email" placeholder="Your email" aria-label="Your email" required>
        <textarea name="t" rows="4" placeholder="What are you working on?" aria-label="Message" required></textarea>
        <button class="btn" type="submit">Send message</button>
      </form>
    </div>
  </section>
</main>
 
<footer>
  <div class="wrap"><span id="copy"></span><span id="place"></span></div>
</footer>
 
<div class="toast" id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
